# HTTPS front for the published Sentinel DNF repository.
# Point root at the directory release.sh publishes (fedora/$releasever/).
server {
    listen 443 ssl;
    server_name updates.example.com;
    root /var/www/sentinel;
    autoindex on;
    ssl_certificate     /etc/pki/tls/certs/sentinel-repo.pem;
    ssl_certificate_key /etc/pki/tls/private/sentinel-repo.key;
    location / {
        try_files $uri $uri/ =404;
    }
}
