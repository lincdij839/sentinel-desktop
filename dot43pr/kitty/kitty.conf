font_family JetBrainsMono Nerd Font
font_size 10
confirm_os_window_close 0
wayland_enable_ime yes

# JetBrains Mono has no CJK. Without an explicit fallback Kitty assigns
# the wrong cell width and sudo/dnf Chinese text overwrites itself.
symbol_map U+2E80-U+2EFF,U+2F00-U+2FDF,U+3000-U+303F,U+3040-U+30FF,U+3100-U+312F,U+31C0-U+31EF,U+31F0-U+31FF,U+3200-U+32FF,U+3300-U+33FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FE10-U+FE1F,U+FE30-U+FE4F,U+FF00-U+FFEF,U+20000-U+2A6DF,U+2F800-U+2FA1F Noto Sans CJK SC
symbol_map U+1F300-U+1FAFF Noto Color Emoji

shell_integration enabled

include matugen.conf

cursor_shape beam
cursor_blink_interval 0.5
